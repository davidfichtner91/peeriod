<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Peeriod">
  <defs>
    <linearGradient id="ig" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Bezpečný kruh uprostřed (maskable safe zone je 192 až 320) -->
  <circle cx="256" cy="256" r="180" fill="url(#ig)"/>
  <!-- Logo: kruh s šipkou -->
  <g transform="translate(256,256)" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="60"/>
    <path d="M 45 -45 L 80 -80"/>
    <path d="M 60 -80 L 80 -80 L 80 -60"/>
    <path d="M 0 60 L 0 100"/>
    <path d="M -40 80 L 40 80"/>
  </g>
</svg>
